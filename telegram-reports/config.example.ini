; ============================================================
;  Telegram 研究報告下載器 設定檔
;  使用方式：把這個檔案複製一份，改名為 config.ini，再填入下面的資料
; ============================================================

[telegram]
; 到 https://my.telegram.org 登入 → API development tools 申請
api_id   =
api_hash =

[download]
; 下載的檔案存放的資料夾（相對於程式所在資料夾）
save_dir = reports
; 要下載的副檔名（逗號分隔）
extensions = .pdf, .doc, .docx, .xls, .xlsx, .xlsm, .csv, .ppt, .pptx
; 第一次執行時往回抓多少則訊息（0 = 全部歷史）
history_limit = 2000
; 跳過自己傳的檔案（true / false）
skip_own = true
; 單一檔案大小上限 MB（0 = 不限制）
max_size_mb = 100

; ------------------------------------------------------------
;  群組設定：每個群組一個區塊，區塊名稱以 group. 開頭（名稱自訂）
;    chat  = 群組名稱（要和 Telegram 顯示的完全一樣）、@username、或 t.me 連結
;            也可以填 list 指令顯示的數字 ID（最準確）
;    topic = 只抓某個主題（論壇型群組才有），留空 = 抓整個群組
;            可填主題名稱或主題 ID，多個用逗號分隔
;  之後要加別的群組，就複製一個區塊改一改即可
; ------------------------------------------------------------

[group.飯桶喇賽群]
chat  = 飯桶喇賽群
topic = memo

; [group.另一個群組]
; chat  = 另一個群組名稱
; topic =
